[project]
name = "autoresearch"
version = "0.2.0"
description = "Autonomous ML research platform — autoreason loop for ReID distillation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core ML
    "torch>=2.9",
    "torchvision>=0.24",
    "transformers>=4.45",
    "peft>=0.12",
    "timm>=1.0",
    # ONNX export (export_onnx.py)
    "onnxruntime-gpu>=1.17,<2",
    # Data / utilities
    "numpy>=2.0",
    "Pillow>=10",
    "einops>=0.8",
    "huggingface-hub>=0.24",
    # Logging
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
torchvision = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
# importlib mode avoids namespace collisions between sibling tests/ folders
# (student_finetune/tests, research_loop/tests, dino_finetune/tests).
addopts = "--import-mode=importlib"
